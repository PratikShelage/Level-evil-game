<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trap Runner</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" width="960" height="720" aria-label="Trap Runner game canvas"></canvas>
      <div class="touch-controls" id="touchControls" hidden>
        <button data-touch="left">◀</button>
        <button data-touch="right">▶</button>
        <button data-touch="jump">⤒</button>
      </div>
    </main>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
